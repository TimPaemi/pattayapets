name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up locked Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject high-severity dependency findings
        run: npm run audit:dependencies
      - name: Exercise staged-build containment
        run: npm run test:build-containment
      - name: Build and run release gates
        run: npm run build:ci
      - name: Run deterministic loopback performance harness
        run: npm run audit:local
      - name: Verify public artifact identity without uploading
        run: node tools/deploy.mjs --dry-run --public-artifact-only
