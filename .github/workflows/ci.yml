name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npm run audit:directory
      # Invariant guard: the six S1 findings from AUDIT-2026-07 must not regress.
      - run: npm run audit:invariants
      # Deploy-identity assertion: the guard must pass on every push. Uploads nothing.
      - run: node tools/deploy.mjs --dry-run
