name: Lighthouse

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    steps:
      - name: Check out the audit configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Audit live flagship routes (${{ matrix.profile }})
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18
        with:
          urls: |
            https://pattayapets.com/
            https://pattayapets.com/bring-pet-to-thailand/
            https://pattayapets.com/pet-emergency/24-hour-vets-pattaya.html
            https://pattayapets.com/vets/
          configPath: ./.github/lighthouserc.${{ matrix.profile }}.json
          uploadArtifacts: true
          temporaryPublicStorage: false
